[package]
name = "vc-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "vc_app"
crate-type = ["lib"]

[[bin]]
name = "vibe-control"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vc-core = { path = "../vc-core" }
vc-store = { path = "../vc-store" }
vc-sessions = { path = "../vc-sessions" }
vc-os-macos = { path = "../vc-os-macos" }
vc-os-windows = { path = "../vc-os-windows" }
